name: Build README

on:
  push:
  workflow_dispatch:
    inputs:
      all:
        description: 'Run against every repo (full scan, ignores the 20-hour window)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'  # Daily incremental
    - cron: '0 4 * * 0'  # Weekly full scan (Sundays)

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.13"

    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Update README
      env:
        GRAPHQL_TOKEN: ${{ secrets.SEAIF_RELEASES_TOKEN }}
      run: |-
        if [ "${{ inputs.all }}" = "true" ] || [ "${{ github.event.schedule }}" = "0 4 * * 0" ]; then
          uv run --frozen build_readme.py --all
        else
          uv run --frozen build_readme.py
        fi
        cat profile/README.md

    - name: Commit and push if changed
      run: |-
        git diff
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Updated content" || exit 0
        git push
